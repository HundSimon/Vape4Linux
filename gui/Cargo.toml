[package]
name = "openvape"
version = "0.1.0"
edition = "2021"
description = "Minimalist native Linux launcher for the OpenVape agent"
license = "CC0-1.0"

[[bin]]
name = "openvape"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
